name: Build and Publish

# 当代码合并到 main（包括上游同步 PR 合并）或手动触发时，
# 构建 bootJar 与 Docker 镜像，推送到 DockerHub。
# 需要仓库 Secrets: DOCKERHUB_USERNAME、DOCKERHUB_TOKEN

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE: shenshangshang/komga-cn

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read version
        id: ver
        run: |
          VERSION=$(grep '^version=' gradle.properties | cut -d= -f2 | tr -d ' \r')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "::notice::Building version $VERSION"

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm
          cache-dependency-path: komga-webui/package-lock.json

      - name: Build (prepareThymeLeaf + bootJar)
        run: |
          SKIP_TYPECHECK=true ./gradlew :komga:prepareThymeLeaf :komga:bootJar --no-daemon --max-workers=2

      - name: Locate built jar
        id: jar
        run: |
          JAR=$(find komga/build/libs -name 'komga-*.jar' ! -name '*-plain*' | head -1)
          if [ -z "$JAR" ]; then
            echo "::error::No bootJar found in komga/build/libs"
            ls -la komga/build/libs/ || true
            exit 1
          fi
          echo "Found jar: $JAR"
          echo "path=$JAR" >> "$GITHUB_OUTPUT"

      - name: Upload jar artifact
        uses: actions/upload-artifact@v4
        with:
          name: komga-${{ steps.ver.outputs.version }}-jar
          path: ${{ steps.jar.outputs.path }}
          if-no-files-found: error

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            JAR_FILE=${{ steps.jar.outputs.path }}
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ steps.ver.outputs.version }}
            ${{ env.IMAGE }}:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
